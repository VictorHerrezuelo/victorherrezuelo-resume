name: Deploy Cloud Resume Challenge

on:
  push:
    branches: [ main ]   # Run on every push to 'main'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest   # GitHub-hosted Linux runner

    steps:
      # 1) Get your code onto the runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2) Install Python (SAM runs on Python)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3) Install AWS SAM CLI (provides 'sam build' and 'sam deploy')
      - name: Install AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      # 4) Validate the SAM template (basic lint)
      - name: Validate SAM template
        run: sam validate --template-file template.yaml

      # 5) Build the SAM app (packages Lambda code, resolves deps)
      - name: Build SAM application
        run: sam build

      # 6) Deploy backend (CloudFormation stack: Lambda, API, DynamoDB)
      - name: Deploy backend with SAM
        run: |
          sam deploy \
            --stack-name cloud-resume-sam \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --capabilities CAPABILITY_IAM \
            --region ${{ secrets.AWS_REGION }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      # 7) Sync frontend to S3 (your static resume site)
      - name: Sync frontend to S3
        run: |
          aws s3 sync frontend/ s3://${{ secrets.S3_BUCKET_NAME }}/ --delete
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

      # 8) Invalidate CloudFront cache (serve the new JS/CSS immediately)
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
